[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miniclaw"
version = "0.1.0"
description = "Lightweight, resumable, observable Python agent runtime (Phase 1)."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
]

[project.optional-dependencies]
web = ["uvicorn>=0.29"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "fastapi>=0.110", "httpx>=0.27"]

[project.scripts]
miniclaw = "miniclaw.gateway.cli:main"

[tool.setuptools.packages.find]
include = ["miniclaw*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
